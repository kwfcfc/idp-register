[book]
title = "idp-register Documentation"
authors = ["idp-register contributors"]
description = "Operator and developer documentation for idp-register."
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"

[output.html]
site-url = "/idp-register/stable/"
git-repository-url = "https://forgejo.goba.ip-dynamic.org/gobro/idp-register"
