<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>idp-register documentation</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 48rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 1.5rem;
        color: color-mix(in srgb, CanvasText 72%, Canvas 28%);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        border-top: 1px solid color-mix(in srgb, CanvasText 18%, Canvas 82%);
      }
      li {
        border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, Canvas 82%);
      }
      a {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 0;
        color: LinkText;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .label {
        color: color-mix(in srgb, CanvasText 62%, Canvas 38%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>idp-register documentation</h1>
      <p>Select a documentation version.</p>
      <ul>
        <li><a href="stable/"><span>stable</span><span class="label">stable</span></a></li>
      </ul>
    </main>
  </body>
</html>
