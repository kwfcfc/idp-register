# The Go service applies the schema on startup (no separate migrate step) and
# embeds the frontend, so this is just Postgres + the single app container.
# For SQLite instead, drop the postgres service and the DATABASE_URL override
# and mount a volume for the SQLITE_PATH file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idp_register
      POSTGRES_USER: idp_register
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp_register -d idp_register"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      # Overrides .env so the app reaches Postgres on the compose network.
      DATABASE_URL: postgres://idp_register:change-me@postgres:5432/idp_register
      ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
