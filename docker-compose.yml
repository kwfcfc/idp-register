services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invite_admin
      POSTGRES_USER: invite_admin
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invite_admin -d invite_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://invite_admin:change-me@postgres:5432/invite_admin
    command: ["./node_modules/.bin/tsx", "scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://invite_admin:change-me@postgres:5432/invite_admin
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
