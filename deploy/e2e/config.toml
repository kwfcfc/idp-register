# Intentionally empty: every value is set as an env var by the `rauthy` step in
# .crow/e2e.jsonnet, which starts Rauthy with an explicit `-c config.toml`.
# Rauthy 0.35.x panicked without a config file; 0.37.x boots without one (when
# no `-c` is given), but the flag above points here, so keep the file. Since
# 0.36, Rauthy panics on unknown keys in this file, so keep it empty.
